services:
  test-db:
    image: pgvector/pgvector:0.8.7-pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: test
      POSTGRES_DB: prisma_embedding_sync_test
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d prisma_embedding_sync_test']
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - test-db-data:/var/lib/postgresql/data

volumes:
  test-db-data:
