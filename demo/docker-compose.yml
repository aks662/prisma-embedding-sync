services:
  demo-db:
    image: pgvector/pgvector:0.8.7-pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-demo}
      POSTGRES_DB: prisma_embedding_sync_demo
    ports:
      - '127.0.0.1:5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d prisma_embedding_sync_demo']
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - demo-db-data:/var/lib/postgresql/data

volumes:
  demo-db-data:
