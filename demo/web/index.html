<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Prisma Embedding Sync Demo</title>
    <style>
      :root {
        font-family: system-ui, sans-serif;
        color: #1f2937;
        background: #f3f4f6;
      }
      body {
        max-width: 960px;
        margin: 2rem auto;
        padding: 0 1rem;
      }
      section {
        background: white;
        border-radius: 12px;
        padding: 1.25rem;
        margin: 1rem 0;
        box-shadow: 0 1px 4px #0001;
      }
      label {
        display: block;
        margin: 0.6rem 0;
      }
      input,
      textarea {
        box-sizing: border-box;
        width: 100%;
        padding: 0.55rem;
        margin-top: 0.25rem;
      }
      textarea {
        min-height: 5rem;
      }
      button {
        padding: 0.55rem 0.85rem;
        cursor: pointer;
      }
      .row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.75rem;
      }
      article {
        border-top: 1px solid #e5e7eb;
        padding: 0.8rem 0;
      }
      small {
        color: #6b7280;
      }
      pre {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      @media (max-width: 650px) {
        .row {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <h1>Prisma Embedding Sync</h1>
    <p>Create products, edit source text or price, and search with pgvector cosine similarity.</p>

    <section>
      <h2>Create product</h2>
      <form id="create-form">
        <label>Name <input name="name" required /></label>
        <label>Description <textarea name="description" required></textarea></label>
        <label>Price <input name="price" type="number" step="0.01" required /></label>
        <button>Create</button>
      </form>
      <pre id="create-result"></pre>
    </section>

    <section>
      <h2>Semantic search</h2>
      <form id="search-form">
        <label>Search text <input name="q" required /></label>
        <button>Search</button>
      </form>
      <div id="search-results"></div>
    </section>

    <section>
      <h2>Products</h2>
      <button id="refresh">Refresh list</button>
      <div id="products"></div>
    </section>

    <script>
      const products = document.querySelector('#products');
      const searchResults = document.querySelector('#search-results');
      const request = async (url, options) => {
        const response = await fetch(url, options);
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || response.statusText);
        return data;
      };
      const productCard = (product) => {
        const card = document.createElement('article');
        card.innerHTML = `<strong>${escapeHtml(product.name)}</strong> · $${escapeHtml(product.price)}<br><small>${escapeHtml(product.description)}</small>`;
        const edit = document.createElement('form');
        edit.className = 'row';
        edit.innerHTML = `<label>Description <textarea name="description">${escapeHtml(product.description)}</textarea></label><label>Price <input name="price" type="number" step="0.01" value="${escapeHtml(product.price)}"></label>`;
        const button = document.createElement('button');
        button.textContent = 'Save changes';
        edit.append(button);
        edit.addEventListener('submit', async (event) => {
          event.preventDefault();
          const form = new FormData(edit);
          try {
            await request(`/products/${product.id}`, {
              method: 'PATCH',
              headers: { 'content-type': 'application/json' },
              body: JSON.stringify({
                description: form.get('description'),
                price: form.get('price'),
              }),
            });
            await refreshProducts();
          } catch (error) {
            alert(error.message);
          }
        });
        card.append(edit);
        return card;
      };
      const escapeHtml = (value) =>
        String(value).replace(
          /[&<>"']/g,
          (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[char],
        );
      const refreshProducts = async () => {
        products.replaceChildren(...(await request('/products')).map(productCard));
      };
      document.querySelector('#create-form').addEventListener('submit', async (event) => {
        event.preventDefault();
        const form = new FormData(event.currentTarget);
        try {
          const created = await request('/products', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify(Object.fromEntries(form)),
          });
          document.querySelector('#create-result').textContent = `Created product ${created.id}`;
          event.currentTarget.reset();
          await refreshProducts();
        } catch (error) {
          alert(error.message);
        }
      });
      document.querySelector('#search-form').addEventListener('submit', async (event) => {
        event.preventDefault();
        const query = new FormData(event.currentTarget).get('q');
        try {
          const results = await request(`/search?q=${encodeURIComponent(query)}`);
          searchResults.replaceChildren(
            ...results.map((item) => {
              const result = document.createElement('article');
              result.textContent = `${item.name} · similarity ${item.similarity.toFixed(4)} · ${item.description}`;
              return result;
            }),
          );
        } catch (error) {
          alert(error.message);
        }
      });
      document.querySelector('#refresh').addEventListener('click', refreshProducts);
      refreshProducts().catch((error) => {
        products.textContent = error.message;
      });
    </script>
  </body>
</html>
